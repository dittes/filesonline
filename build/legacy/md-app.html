  <section class="mdv-window" id="editor" data-empty="true" aria-label="Markdown editor and viewer">

    <div class="mdv-toolbar" role="toolbar" aria-label="Markdown tools">
      <div class="mdv-group">
        <button class="mdv-tb mdv-tb--primary" type="button" id="mdv-open-btn" title="Open file (Ctrl+O)">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H6l1.5 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Open</span>
        </button>
        <button class="mdv-tb" type="button" id="mdv-save-btn" title="Save MD (Ctrl+S)">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 2.5h8l2 2v9H3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.5 2.5v3h4v-3M5.5 13.5v-4h5v4" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Save</span>
        </button>
        <details class="mdv-menu" id="mdv-more-menu">
          <summary class="mdv-tb" aria-label="More file actions" title="More">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>
            <span class="mdv-tb__more">More</span>
          </summary>
          <div class="mdv-menu__list">
            <button type="button" id="mdv-saveas-btn" title="Save As">Save As</button>
            <button type="button" id="mdv-import-html-btn" title="Import an HTML file and convert it to Markdown">Import HTML</button>
            <button type="button" id="mdv-paste-menu-btn">Paste Markdown</button>
          </div>
        </details>
      </div>

      <details class="mdv-menu" id="mdv-export-menu">
        <summary class="mdv-tb" aria-label="Export" title="Export">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v7M5 6.5l3 3 3-3M3 11.5v1.5h10v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Export</span>
          <svg class="mdv-caret" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="mdv-menu__list">
          <button type="button" id="mdv-export-pdf-btn" title="Export PDF (Ctrl+P)">PDF</button>
          <button type="button" id="mdv-export-html-btn" title="Export HTML (Ctrl+E)">HTML</button>
          <button type="button" id="mdv-export-standalone-btn" title="Export standalone HTML with inline CSS">Standalone HTML</button>
          <button type="button" id="mdv-export-txt-btn" title="Export plain text">Plain Text</button>
          <hr>
          <button type="button" id="mdv-copy-md-btn" title="Copy Markdown to clipboard">Copy MD</button>
          <button type="button" id="mdv-copy-html-btn" title="Copy rendered HTML to clipboard">Copy HTML</button>
        </div>
      </details>

      <div class="mdv-spacer"></div>

      <div class="mdv-seg" role="group" aria-label="View mode">
        <button type="button" data-mdv-view="split" class="active" title="Split view">Split</button>
        <button type="button" data-mdv-view="editor" title="Editor only">Editor</button>
        <button type="button" data-mdv-view="preview" title="Preview only">Preview</button>
        <button type="button" data-mdv-view="raw" title="Raw HTML output">HTML</button>
      </div>

      <button class="mdv-tb mdv-tb--quiet" type="button" id="mdv-clear-btn" title="Clear the editor">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8h5.8l.6-8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Clear</span>
      </button>
    </div>

    <div class="mdv-body">
      <div class="mdv-empty-state" id="mdv-dropzone">
        <svg class="mdv-empty-state__icon" viewBox="0 0 48 48" fill="none" width="56" height="56" aria-hidden="true">
          <path d="M10 6h20l8 8v28H10z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M30 6v8h8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M17 30l3-8 3 5 3-5 3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="mdv-empty-state__title">Drop a Markdown file here</p>
        <div class="mdv-empty-state__actions">
          <button class="s-btn s-btn--primary" type="button" id="mdv-choose-btn">Choose file</button>
          <button class="s-btn s-btn--secondary" type="button" id="mdv-paste-btn">Paste Markdown</button>
          <button class="s-btn s-btn--secondary" type="button" id="mdv-sample-btn">Try sample</button>
          <button class="s-btn s-btn--link" type="button" id="mdv-write-btn">Start writing</button>
        </div>
        <p class="mdv-empty-state__note">Supported: <code>.md</code>, <code>.markdown</code>, <code>.txt</code>, <code>.html</code> — processed locally, never uploaded.</p>
      </div>

      <div class="mdv-panes" id="mdv-panes" data-view="split">
        <textarea
          class="mdv-editor"
          id="mdv-editor"
          spellcheck="false"
          aria-label="Markdown source"
          placeholder="# Start typing Markdown here…&#10;&#10;Or drop a .md file anywhere on this page."></textarea>

        <div class="mdv-preview-pane" id="mdv-preview-pane">
          <details class="mdv-toc" id="mdv-toc" hidden>
            <summary>Table of contents</summary>
            <nav id="mdv-toc-list" aria-label="Table of contents"></nav>
          </details>
          <article class="md-preview" id="mdv-preview" aria-label="Rendered Markdown preview"></article>
        </div>

        <pre class="mdv-raw" id="mdv-raw" hidden aria-label="Generated HTML source"><code id="mdv-raw-code"></code></pre>
      </div>
    </div>

    <div class="mdv-status" aria-live="polite">
      <span class="mdv-status__name" id="mdv-filename">untitled.md</span>
      <span class="mdv-dirty" id="mdv-dirty" hidden title="Unsaved changes">●</span>
      <span class="mdv-status__stats">
        <span id="mdv-stat-words">0 words</span>
        <span id="mdv-stat-chars">0 characters</span>
        <span id="mdv-stat-lines">0 lines</span>
      </span>
    </div>
  </section>

  <!-- Hidden file inputs -->
  <input type="file" id="mdv-file-input" accept=".md,.markdown,.txt,.text,text/markdown,text/plain" hidden>
  <input type="file" id="mdv-html-input" accept=".html,.htm,text/html" hidden>

  <!-- Paste / import modal -->
  <div class="mdv-modal-overlay" id="mdv-paste-modal" hidden role="dialog" aria-modal="true" aria-labelledby="mdv-paste-title">
    <div class="mdv-modal">
      <div class="mdv-modal__header">
        <h3 id="mdv-paste-title">Paste Markdown or HTML</h3>
        <button class="mdv-modal__close mdv-modal-close" type="button" aria-label="Close dialog">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="mdv-modal__body">
        <textarea class="mdv-input mdv-paste-textarea" id="mdv-paste-textarea" rows="10" placeholder="Paste Markdown or HTML here…" aria-label="Paste content"></textarea>
        <div class="mdv-url-row">
          <input type="url" class="mdv-input" id="mdv-url-input" placeholder="…or import from URL (https://example.com/page.html)" aria-label="Import from URL">
          <button class="s-btn s-btn--secondary mdv-fetch" type="button" id="mdv-url-fetch-btn">Fetch</button>
        </div>
        <p class="mdv-hint">URL import only works when the source allows browser CORS.</p>
      </div>
      <div class="mdv-modal__footer">
        <button class="s-btn s-btn--secondary mdv-modal-close" type="button">Cancel</button>
        <button class="s-btn s-btn--secondary" type="button" id="mdv-paste-html-btn" title="Convert the pasted HTML to Markdown">Convert HTML → Markdown</button>
        <button class="s-btn s-btn--primary" type="button" id="mdv-paste-md-btn">Load as Markdown</button>
      </div>
    </div>
  </div>
